<!-- Latest compiled and minified CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Latest compiled JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<table class="table">
    <thead>
      <tr>
        <th >DATE</th>
        <th >last update</th>
        <th >confirmed</th>
        <th >confirmed diff</th>
        <th >deaths</th>
        <th>deaths diff</th>
        <th>recovered</th>
        <th>recovered_diff</th>
        <th>active</th>
        <th>activediff</th>
        <th>fatality rate</th>
      </tr>
    </thead>
    <tbody id="tableRows"></tbody>
    </table>

<script>
  var requestOptions = {
  method: 'GET',
  redirect: 'follow'
};

fetch("https://covid-api.com/api/reports/total?date=2020-04-15", requestOptions)
.then(res => res.json())
.then(console.log)
//   .then(result => console.log(result))
//   .catch(error => console.log('error', error));

.then(res => {
    const covid = res.data;  
    let rows = '';
    covid.forEach(get => {
        rows += `
        <tr>
            <td>${get.date}</td>
             <td>${get.last_update}</td>
             <td>${get.confirmed}</td>
              <td>${get.confirmed_diff}</td>
               <td>${get.deaths}</td>
                <td>${get.deaths_diff}</td>
                 <td>${get.recovered}</td>
                  <td>${get.recovered_diff}</td>
                   <td>${get.active}</td>
                    <td>${get.active_diff}</td>
                     <td>${get.fatality_rate}</td>
            </tr>`
    })

    document.getElementById('tableRows').innerHTML = rows;
}).catch(error => console.log(error))

</script>
